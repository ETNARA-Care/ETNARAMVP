name: Deploy ETNARA MVP to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure GitHub Pages
        working-directory: frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          vite = Path("vite.config.ts")
          text = vite.read_text()

          if re.search(r"\bbase\s*:", text):
              text = re.sub(
                  r"""base\s*:\s*["'][^"']*["']""",
                  "base: '/ETNARAMVP/'",
                  text,
                  count=1
              )
          else:
              text = text.replace(
                  "defineConfig({",
                  "defineConfig({\n  base: '/ETNARAMVP/',",
                  1
              )

          vite.write_text(text)

          app = Path("src/App.tsx")
          if app.exists():
              text = app.read_text()
              if "<BrowserRouter>" in text:
                  text = text.replace(
                      "<BrowserRouter>",
                      "<BrowserRouter basename={import.meta.env.BASE_URL}>"
                  )
              app.write_text(text)
          PY

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test -- --run

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: https://etnara-care-backend-staging-production-b0b7.up.railway.app
        run: npm run build

      - name: Add SPA fallback
        working-directory: frontend
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
