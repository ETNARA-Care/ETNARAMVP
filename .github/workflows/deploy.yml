name: Deploy ETNARA MVP to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        

      - name: Unzip ETNARA frontend
        run: |
          unzip -q ETNARALAST-NEW.zip
          ls -la
          ls -la frontend

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure GitHub Pages base path
        working-directory: frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path

          vite = Path("vite.config.ts")
          text = vite.read_text()

          if "base:" not in text:
              text = text.replace(
                  "defineConfig({",
                  "defineConfig({\n  base: '/ETNARAMVP/',"
              )

          vite.write_text(text)

          app = Path("src/App.tsx")
          text = app.read_text()

          if "basename={import.meta.env.BASE_URL}" not in text:
              text = text.replace(
                  "<BrowserRouter>",
                  "<BrowserRouter basename={import.meta.env.BASE_URL}>"
              )

          app.write_text(text)
          PY

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test -- --run

     - name: Build
  working-directory: frontend
  run: npm run build
  

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
