name: Deploy ETNARA V23 to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare frontend v23
        run: |
          rm -rf frontend-v23
          mkdir frontend-v23
          unzip -q frontend-v23.zip -d frontend-v23

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-v23/package-lock.json

      - name: Install dependencies
        working-directory: frontend-v23
        run: npm ci

      - name: Type check
        working-directory: frontend-v23
        run: npm run build

      - name: Build production
        working-directory: frontend-v23
        env:
          VITE_API_URL: https://etnara-care-backend-staging-production-b0b7.up.railway.app
        run: npm run build

      - name: Add SPA fallback
        working-directory: frontend-v23
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend-v23/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
